<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DevSecOps Kit Security Report</title>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			padding: 20px;
		}

		.container {
			max-width: 1200px;
			margin: 0 auto;
		}

		header {
			background: white;
			border-radius: 8px;
			padding: 30px;
			margin-bottom: 20px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		}

		h1 {
			color: #333;
			margin-bottom: 10px;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.timestamp {
			color: #666;
			font-size: 14px;
		}

		.status-badge {
			display: inline-block;
			padding: 8px 16px;
			border-radius: 20px;
			font-weight: 600;
			margin-top: 15px;
		}

		.status-pass {
			background: #d4edda;
			color: #155724;
		}

		.status-fail {
			background: #f8d7da;
			color: #721c24;
		}

		.summary {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 20px;
			margin-bottom: 30px;
		}

		.card {
			background: white;
			border-radius: 8px;
			padding: 20px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		}

		.card h3 {
			color: #333;
			margin-bottom: 15px;
			font-size: 14px;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		.stat {
			display: flex;
			justify-content: space-between;
			padding: 8px 0;
			border-bottom: 1px solid #eee;
		}

		.stat:last-child {
			border-bottom: none;
		}

		.stat-label {
			color: #666;
		}

		.stat-value {
			font-weight: 600;
			color: #333;
		}

		.severity-critical { color: #dc3545; }
		.severity-high { color: #fd7e14; }
		.severity-medium { color: #ffc107; }
		.severity-low { color: #28a745; }

		.charts {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
			gap: 20px;
			margin-bottom: 30px;
		}

		.chart-container {
			background: white;
			border-radius: 8px;
			padding: 20px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		}

		.chart-container h3 {
			margin-bottom: 20px;
			color: #333;
		}

		canvas {
			max-height: 300px;
		}

		.findings {
			background: white;
			border-radius: 8px;
			padding: 20px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		}

		.findings h2 {
			color: #333;
			margin-bottom: 20px;
		}

		.tool-section {
			margin-bottom: 30px;
		}

		.tool-title {
			color: #667eea;
			font-size: 18px;
			font-weight: 600;
			margin-bottom: 15px;
			padding-bottom: 10px;
			border-bottom: 2px solid #667eea;
		}

		.finding {
			border-left: 4px solid #ddd;
			padding: 15px;
			margin-bottom: 10px;
			background: #f9f9f9;
			border-radius: 4px;
		}

		.finding.critical {
			border-left-color: #dc3545;
			background: #fff5f5;
		}

		.finding.high {
			border-left-color: #fd7e14;
			background: #fffaf5;
		}

		.finding.medium {
			border-left-color: #ffc107;
			background: #fffef5;
		}

		.finding.low {
			border-left-color: #28a745;
			background: #f5fff9;
		}

		.finding-header {
			display: flex;
			justify-content: space-between;
			align-items: start;
			margin-bottom: 10px;
		}

		.finding-file {
			font-weight: 600;
			color: #333;
		}

		.finding-severity {
			font-weight: 600;
			font-size: 12px;
			text-transform: uppercase;
			padding: 4px 8px;
			border-radius: 3px;
		}

		.severity-critical { background: #dc3545; color: white; }
		.severity-high { background: #fd7e14; color: white; }
		.severity-medium { background: #ffc107; color: #333; }
		.severity-low { background: #28a745; color: white; }

		.finding-line {
			color: #666;
			font-size: 12px;
			margin-bottom: 8px;
		}

		.finding-message {
			color: #555;
			margin-bottom: 8px;
		}

		.finding-rule {
			color: #999;
			font-size: 12px;
			font-family: 'Courier New', monospace;
		}

		.no-findings {
			text-align: center;
			padding: 40px;
			color: #666;
		}

		.export-btn {
			background: #667eea;
			color: white;
			border: none;
			padding: 10px 20px;
			border-radius: 4px;
			cursor: pointer;
			font-size: 14px;
			margin-bottom: 20px;
		}

		.export-btn:hover {
			background: #5568d3;
		}

		footer {
			text-align: center;
			color: white;
			margin-top: 40px;
			padding: 20px;
		}

		@media (max-width: 768px) {
			.summary {
				grid-template-columns: 1fr;
			}

			.charts {
				grid-template-columns: 1fr;
			}

			header {
				padding: 20px;
			}

			h1 {
				font-size: 20px;
			}
		}

		@media print {
			body {
				background: white;
			}

			.export-btn {
				display: none;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<header>
			<h1>🔐 DevSecOps Kit Security Report</h1>
			<p class="timestamp">Generated: 2025-11-22T22:12:36-08:00</p>
			<div class="status-badge status-pass">
				✅ Status: PASS
			</div>
			
		</header>

		<div class="summary">
			<div class="card">
		<h3>Overall Summary</h3>
		<div class="stat">
			<span class="stat-label">Total Findings</span>
			<span class="stat-value">0</span>
		</div>
		<div class="stat">
			<span class="stat-label">Status</span>
			<span class="stat-value">PASS</span>
		</div>
		<div class="stat">
			<span class="stat-label">Blocking Issues</span>
			<span class="stat-value">0</span>
		</div>
	</div><div class="card">
				<h3>trivy</h3>
				<div class="stat">
					<span class="stat-label">Total</span>
					<span class="stat-value">0</span>
				</div>
				<div class="stat">
					<span class="stat-label"><span class="severity-critical">CRITICAL</span></span>
					<span class="stat-value">0</span>
				</div>
				<div class="stat">
					<span class="stat-label"><span class="severity-high">HIGH</span></span>
					<span class="stat-value">0</span>
				</div>
				<div class="stat">
					<span class="stat-label"><span class="severity-medium">MEDIUM</span></span>
					<span class="stat-value">0</span>
				</div>
				<div class="stat">
					<span class="stat-label"><span class="severity-low">LOW</span></span>
					<span class="stat-value">0</span>
				</div>
			</div>
		</div>

		<div class="charts">
			
		</div>

		<div class="findings">
			<button class="export-btn" onclick="downloadJSON()">📥 Export as JSON</button>
			<h2>Detailed Findings</h2>
			<div class="no-findings">✅ No security findings detected!</div>
		</div>

		<footer>
			<p>DevSecOps Kit v0.4.1 • <a href="https://github.com/edgarpsda/devsecops-kit" style="color: white;">GitHub</a></p>
		</footer>
	</div>

	<script>
		const reportData = {"timestamp":"2025-11-22T22:12:36-08:00","status":"PASS","blocking_count":0,"results":{"trivy":{"tool":"trivy","status":"success","findings":[],"summary":{"total":0,"critical":0,"high":0,"medium":0,"low":0}}},"all_findings":null};

		function downloadJSON() {
			const dataStr = JSON.stringify(reportData, null, 2);
			const dataBlob = new Blob([dataStr], {type: 'application/json'});
			const url = URL.createObjectURL(dataBlob);
			const link = document.createElement('a');
			link.href = url;
			link.download = 'security-report.json';
			link.click();
		}
	</script>
</body>
</html>
